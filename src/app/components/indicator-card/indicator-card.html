<div class="indicator-card">
  <img [src]="icon" alt="indicator icon" class="indicator-icon" />
  <div class="indicator-content">
    <div class="divider"></div>
  <div class="indicator-container">
    <h3 class="indicator-value">{{ value }}</h3>
    <p class="indicator-label" [class.indicator-label--inline]="label.includes('(INR)')">{{ label }}</p>
  </div>
</div>
</div>
