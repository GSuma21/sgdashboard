<div class="container">
    <div class="left-panel">
        <h2 class="section-title">Themes beneath the voices</h2>
        <div class="heatmap-grid">
            <div *ngFor="let theme of themes" class="heatmap-item" [ngClass]="theme.gridClass"
                [class.active]="activeThemeId === theme.id" [class]="theme.color"
                (mouseenter)="setActiveTheme(theme.id)">
                <div class="content">
                    <div class="icon" *ngIf="theme.icon">
                        <img [src]="theme.icon" alt="icon" class="icon-img" />
                    </div>
                    <div class="text-spacing">
                    <h3 class="theme-title">{{ theme.label }}</h3>
                    <p class="voice-count" *ngIf="theme.value > 0">{{ theme.value }} Voices raised</p>
                </div>
                </div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <h2 class="section-title">What we are hearing</h2>
        <div class="voices-grid" [@voicesAnimation]="displayedVoices.length">
            <div *ngFor="let voice of displayedVoices" class="voice-card active" [ngClass]="voice.color">
                <img src="/assets/icons/quote.png" alt="" class="quote-icon">
                <div class="quote-container">
                    <p class="quote-text">{{ voice.description }}</p>
                    <p class="quote-author">– {{ voice.voice_by }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
