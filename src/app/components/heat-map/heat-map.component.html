<div class="container">
    <!-- Left Panel: Heatmap -->
    <div class="left-panel">
        <h2 class="section-title">Themes beneath the voices</h2>
        <div class="heatmap-grid">
            <div *ngFor="let theme of themes" class="heatmap-item" [ngClass]="theme.gridClass"
                [class.active]="activeThemeId === theme.id" [class]="theme.color"
                (mouseenter)="setActiveTheme(theme.id)">
                <div class="content">
                    <div class="icon" *ngIf="theme.icon">
                        <!-- Placeholder for icon, using text or a simple shape for now -->
                        <img [src]="theme.icon" alt="icon" class="icon-img" />
                    </div>
                    <h3 class="theme-title">{{ theme.title }}</h3>
                    <p class="voice-count" *ngIf="theme.count > 0">{{ theme.count }} Voices raised</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Panel: Similar Voices -->
    <div class="right-panel">
        <h2 class="section-title">What we are hearing</h2>
        <div class="voices-grid" [@voicesAnimation]="displayedVoices.length">
            <div *ngFor="let voice of displayedVoices" class="voice-card" [ngClass]="voice.color">
                <div class="quote-icon">“</div>
                <p class="quote-text">{{ voice.text }}</p>
                <p class="quote-author">– {{ voice.author }}</p>
            </div>
        </div>
    </div>
</div>
