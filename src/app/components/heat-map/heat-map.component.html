<div class="container">
    <div class="left-panel">
        <h2 class="section-title">Themes beneath the voices</h2>
        <div class="treemap-shell" *ngIf="themes && themes.length">
            <canvas #treemapCanvas aria-label="Themes beneath the voices treemap"></canvas>
            <div
                class="treemap-tooltip"
                *ngIf="hoveredThemeTooltip"
                [style.left.px]="hoveredThemeTooltip.left"
                [style.top.px]="hoveredThemeTooltip.top"
            >
                {{ hoveredThemeTooltip.label }}
            </div>
        </div>
    </div>

    <div class="right-panel">
        <h2 class="section-title">What we are hearing</h2>
        <div class="voices-grid" [@voicesAnimation]="displayedVoices.length">
            <div *ngFor="let voice of displayedVoices" class="voice-card active" [ngClass]="voice.color" [style.background-color]="voice.activeBackgroundColor || voice.backgroundColor">
                <img src="/assets/icons/quote.png" alt="Quotation mark icon" class="quote-icon">
                <div class="quote-container">
                    <p class="quote-text">{{ voice.description }}</p>
                    <p class="quote-author">– {{ voice.voice_by }},{{voice.state | titlecase}}</p>
                </div>
            </div>
        </div>
    </div>
</div>
