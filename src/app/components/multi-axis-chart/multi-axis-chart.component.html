<div class="chart-container">
  <div class="header-row">
    <mat-card-title>{{chartData.title}}</mat-card-title>
    <div class="legend">
      @for (legend of chartData?.legends; track $index) {
      <div class="legend-item">
        <span class="dot" [ngClass]="$index === 0 ? 'orange' : 'purple'">
        </span>
        <span class="text">{{ legend }}</span>
      </div>
      }
    </div>
  </div>


    <div class="year-buttons">
      <!-- <button mat-button *ngFor="let item of data" class="year-button"
              [ngClass]="{'enabled':item.year === year }"
              (click)="showYearData(item)">
        {{ item.year }}
      </button> -->
      <button mat-button class="year-button">{{year}}
      </button>
    </div>
<div class="chart">
  <canvas baseChart width="800" height="400" [data]="lineChartData" [options]="lineChartOptions" [type]="lineChartType">
  </canvas>
</div>
</div>
