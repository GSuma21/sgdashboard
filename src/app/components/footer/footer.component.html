<footer class="sg-footer">

  <!-- Background Images -->

  <img src="assets/icons/dandelion-footer.svg" class="sg-footer__bg1" alt="">

  <img src="assets/icons/dandelion-footer-2.svg" class="sg-footer__bg3" alt="">

  <img src="assets/icons/dandelion-footer-3.svg" class="sg-footer__bg2" alt="">


  <div class="sg-footer__main">

    <!-- LEFT -->

    <div class="sg-footer__logo-col">

      <div class="sg-footer__logo-row">
        <img
          src="https://shikshagraha.org/wp-content/themes/twentytwentythree-child/images/Group-232-1.svg"
          class="sg-footer__logo-icon"
          alt="Shikshagraha logo">
      </div>

      <p class="sg-footer__tagline">
        {{footerText.tagline}}
      </p>

      <div class="sg-footer__socials">

        <a
          *ngFor="let social of socialLinks"
          class="sg-footer__social-link"
          [href]="social.href"
          target="_blank"
          rel="noopener noreferrer">

          <img
            [src]="social.img"
            class="sg-footer__social-icon"
            [alt]="social.label">
        </a>

      </div>

    </div>

    <!-- RIGHT -->

    <div class="sg-footer__right">

      <!-- Movement -->

      <div>

        <p class="sg-footer__nav-heading">{{footerText.movementHeading}}</p>

        <ul class="sg-footer__nav-list">

          <li *ngFor="let item of movementLinks">

            <a
              [href]="item.href"
              class="sg-footer__nav-link">

              {{item.label}}

            </a>

          </li>

        </ul>

      </div>

      <!-- Connect -->

      <div>

        <p class="sg-footer__nav-heading">{{footerText.connectHeading}}</p>

        <ul class="sg-footer__nav-list">

          <li *ngFor="let item of connectLinks">

            <a
              [href]="item.href"
              (click)="handleConnectLinkClick($event, item)"
              class="sg-footer__nav-link">

              {{item.label}}

            </a>

          </li>

          <li>

            <a
              [href]="JOIN_MOVEMENT_FORM_LINK"
              target="_blank"
              class="sg-footer__join-btn">

              {{footerText.joinMovement}}

            </a>

          </li>

        </ul>

      </div>

    </div>

  </div>

  <div class="sg-footer__bottom">

    <p>{{footerText.copyright}}</p>

    <p>
      {{footerText.address}}
    </p>

  </div>

</footer>
