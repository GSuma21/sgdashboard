<div class="modal-backdrop" (click)="closeModal()"></div>

<div class="share-modal">
  <button class="close-btn" (click)="closeModal()">✕</button>

  <h3 class="title">Help us amplify this story</h3>

  <div class="section">
    <p class="label">Share on:</p>

    <div class="share-icons">
      <button class="share-item linkedin" (click)="share('linkedin')">
        <span>LinkedIn</span>
        <img src="assets/icons/linkedin.svg" alt="LinkedIn" />
      </button>
    
      <button class="share-item whatsapp" (click)="share('whatsapp')">
        <span>WhatsApp</span>
        <img src="assets/icons/whatsapp.svg" alt="WhatsApp" />
      </button>
    
      <button class="share-item facebook" (click)="share('facebook')">
        <span>Facebook</span>
        <img src="assets/icons/facebook.svg" alt="Facebook" />
      </button>
    
      <button class="share-item instagram" (click)="share('instagram')">
        <span>Instagram</span>
        <img src="assets/icons/instagram.svg" alt="Instagram" />
      </button>
    </div>
    
      
  </div>

  <div class="section">
    <p class="label">Copy Link:</p>

    <div class="copy-box">
      <input #linkInput type="text" [value]="shareLink" readonly />
      <button
  (click)="copyLink(linkInput)"
  aria-label="Copy link to clipboard"
  title="Copy link"
>
  📋
</button>

    </div>
  </div>
</div>
